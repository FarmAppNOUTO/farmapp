{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>圃場マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- polylabelライブラリ（必須） -->
  <script src="{% static 'fields/js/polylabel.min.js' %}"></script>

  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family:sans-serif; }
    header { height:60px; background:#2e7d32; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; position:fixed; top:0; left:0; right:0; z-index:1000; }
    #map { width:100%; height:calc(100vh - 60px); height:calc(100dvh - 60px); margin-top:60px; border:none; }

    /* モーダル */
    .modal-bg { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; overflow-y:auto; }
    .modal { background:#fff; padding:20px; border-radius:8px; max-width:400px; width:90%; box-shadow:0 4px 10px rgba(0,0,0,0.3); }
    .modal h2 { margin-top:0; }
    .modal button { margin-top:10px; padding:8px 12px; border:none; border-radius:4px; cursor:pointer; }
    .add-btn { background:#1976d2; color:#fff; }
    .close-btn { background:#999; color:#fff; margin-left:5px; }
    .task-list { max-height:150px; overflow-y:auto; margin-top:10px; border-top:1px solid #ccc; padding-top:5px; }
    .task-item { border-bottom:1px solid #eee; padding:5px 0; font-size:14px; }

    /* 入力フォーム */
    #task-form label { display:block; margin-top:8px; font-weight:bold; }
    #task-form input, #task-form textarea, #task-form select { width:100%; padding:5px; margin-top:2px; box-sizing:border-box; }

    /* ラベル（背景なし・白フチ文字・preで改行保持） */
    .field-tooltip {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 10px;
      font-weight: bold;
      color: red;
      text-shadow: 0 0 3px white;
                   0 0 3px white;
                   0 0 3px white;
      white-space: pre;
      pointer-events: none;
    }

      /* 作業追加フォームのラベル用 */
      #task-form label {
        display: block;   /* ブロックにして必ず改行 */
        margin-top: 8px;
        font-weight: bold;
      }

      /* 作業追加フォームの入力欄 */
      #task-form input,
      #task-form select,
      #task-form textarea {
        width: 100%;
        padding: 5px;
        margin-top: 2px;
        box-sizing: border-box;
      }

    @media (max-width:768px){
      header{height:50px;}
      #map{height:calc(100vh - 50px); height:calc(100dvh - 50px); margin-top:50px;}
    }
  </style>

{% csrf_token %}
<script>
  // ページ表示時に CSRF トークンを cookie にセット
  document.cookie = "csrftoken={{ csrf_token }}; path=/";
</script>

</head>
<body>
  <header>圃場マップ</header>
  <div id="map"></div>

  <!-- モーダル -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h2 id="modal-field-name"></h2>
      <p id="modal-field-crop"></p>
      <p id="modal-field-area"></p>

      <!-- 作業履歴 -->
      <div class="task-list" id="task-list">
        <h3>作業履歴</h3>
      </div>

      <!-- 作業追加ボタン -->
      <button class="add-btn" id="show-form-btn">作業追加</button>

      <!-- 作業追加フォーム -->
      <div id="task-form">
        <label>日付</label>
        <input type="date" id="task-date" required>

       <!-- 作業者名 -->
       <label>作業者名</label>
       <select id="task-worker" required>
         <option value="">選択してください</option>
         {% for w in options.workers %}
           <option value="{{ w }}">{{ w }}</option>
         {% endfor %}
         <option value="_new_">＋ 新しい作業者を追加</option>
       </select>
       <button type="button" onclick="deleteSelectedOption('task-worker', 'workers')">🗑</button>

       <!-- 対象作物 -->
       <label>対象作物</label>
       <select id="task-target-crop" required>
         <option value="">選択してください</option>
         {% for c in options.crops %}
           <option value="{{ c }}">{{ c }}</option>
         {% endfor %}
         <option value="_new_">＋ 新しい作物を追加</option>
       </select>
       <button type="button" onclick="deleteSelectedOption('task-target-crop', 'crops')">🗑</button>

        <label>作業内容</label>
        <input type="text" id="task-content" required>


        <label>使用薬剤</label>
        <input type="text" id="task-chemical">
        <label>使用量</label>
        <input type="text" id="task-quantity">
        <label>備考</label>
        <textarea id="task-note"></textarea>
        <button class="add-btn" onclick="addTask()">追加</button>
      </div>

      <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    // ======== 地図初期化 =========
    const map = L.map('map').setView([44.0361, 142.3187], 15);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
    }).addTo(map);

    // ------------------------------
    // モーダル関連
    // ------------------------------
    const modalBg = document.getElementById('modal-bg');
    const fieldNameEl = document.getElementById('modal-field-name');
    const fieldCropEl = document.getElementById('modal-field-crop');
    const fieldAreaEl = document.getElementById('modal-field-area');
    const taskListEl = document.getElementById('task-list');
    const taskFormEl = document.getElementById('task-form');
    const showFormBtn = document.getElementById('show-form-btn');

    const taskData = {}; // 作業履歴オブジェクト

    // 作物ごとの色
    const cropColors = {
      'そば': '#f4a261',
      '小麦': '#2a9d8f',
      'じゃがいも': '#e76f51',
      'トマト': '#e63946',
      'default': '#8d99ae'
    };

    const tooltips = []; // ラベル保持用配列

    // モーダル開閉
    function openModal(field){
      fieldNameEl.textContent = field.name;
      fieldCropEl.textContent = '作物: ' + field.crop;
      fieldAreaEl.textContent = '面積: ' + field.area;
      modalBg.style.display = 'flex';
      modalBg.dataset.fieldId = field.id;

      taskFormEl.style.display = 'none';
      showFormBtn.style.display = 'block';

      renderTaskList(field.id);
    }

    function closeModal(){
      modalBg.style.display = 'none';
      ['task-date','task-worker','task-content','task-target-crop','task-chemical','task-quantity','task-note']
        .forEach(id=>document.getElementById(id).value='');
    }

    // 作業履歴表示
    function renderTaskList(fieldId){
      taskListEl.innerHTML='<h3>作業履歴</h3>';
      if(!taskData[fieldId] || taskData[fieldId].length===0){
        taskListEl.innerHTML+='<p>まだ作業履歴はありません</p>';
        return;
      }
      taskData[fieldId].forEach(task=>{
        const div=document.createElement('div');
        div.className='task-item';
        div.innerHTML=`${task.date} - ${task.worker} - ${task.content} - ${task.targetCrop} - ${task.chemical||'-'} - ${task.quantity||'-'} - ${task.note||'-'}`;
        taskListEl.appendChild(div);
      });
    }

    showFormBtn.onclick = () => {
      taskFormEl.style.display = 'block';
      showFormBtn.style.display = 'none';
    }

    function addTask(){
      const fieldId = modalBg.dataset.fieldId;
      const task = {
        date: document.getElementById('task-date').value,
        worker: document.getElementById('task-worker').value,
        content: document.getElementById('task-content').value,
        targetCrop: document.getElementById('task-target-crop').value,
        chemical: document.getElementById('task-chemical').value,
        quantity: document.getElementById('task-quantity').value,
        note: document.getElementById('task-note').value
      };
      if(!task.date || !task.worker || !task.content || !task.targetCrop){
        alert('必須項目を入力してください');
        return;
      }
      if(!taskData[fieldId]) taskData[fieldId]=[];
      taskData[fieldId].push(task);

      renderTaskList(fieldId);
      ['task-date','task-worker','task-content','task-target-crop','task-chemical','task-quantity','task-note']
        .forEach(id=>document.getElementById(id).value='');
      taskFormEl.style.display='none';
      showFormBtn.style.display='block';
    }

    // === 重なり防止用: すでに配置済みラベル位置を記録 ===
    const placedLabels = [];

    // ======== GeoJSON 読み込み・ラベル配置 =========
    fetch("{% static 'fields/data/和寒ML.geojson' %}")
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          style: feature => ({
            color:'#555',
            weight:1,
            fillColor: cropColors[feature.properties.crop] || cropColors['default'],
            fillOpacity:0.6
          }),
          onEachFeature: (feature, layer) => {
            layer.on('click', () => openModal(feature.properties));

            // === polylabelで最適ラベル位置取得 ===
            let coords = feature.geometry.type === "Polygon"
              ? feature.geometry.coordinates
              : feature.geometry.coordinates[0];
            let bestPoint = polylabel(coords, 1.0);
            let latlng = [bestPoint[1], bestPoint[0]];

            // === 重なりを検出して少しずらす（簡易処理） ===
            const OFFSET = 0.00005; // 約5mずらす
            placedLabels.forEach(p => {
              const dx = latlng[0] - p[0];
              const dy = latlng[1] - p[1];
              if (Math.sqrt(dx*dx + dy*dy) < OFFSET * 2) {
                latlng[0] += OFFSET;
                latlng[1] += OFFSET;
              }
            });
            placedLabels.push(latlng);

            const name = feature.properties.name || "未設定";
            const crop = feature.properties.crop || "";

            const tooltip = L.tooltip({
              permanent: true,
              direction: 'center',
              className: 'field-tooltip',
              interactive: false
            })
              .setLatLng(latlng)
              .setContent(map.getZoom() >= 16 ? `${name}\n${crop}` : name)
              .addTo(map);

            // === ズーム切り替え ===
            map.on("zoomend", () => {
              tooltip.setContent(map.getZoom() >= 16 ? `${name}\n${crop}` : name);
            });
          }
        }).addTo(map);
      });

// ===== ヘルパー関数の導入 =====
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

// ===== 新しい選択肢追加処理 =====
function promptNewOption(selectId, type) {
  const newValue = prompt("新しい項目を入力してください:");
  if (!newValue) return;

  fetch('/save_option/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({
      type: type,
      value: newValue
    })
  })
  .then(res => res.json()) // ← ここで JSON を受け取る
  .then(data => {           // ← ここで data が response の役割
    if (data.status === 'ok') {
      alert(`「${data.added}」を追加しました。`);

      const select = document.getElementById(selectId);
      const option = document.createElement('option');
      option.value = data.added;
      option.textContent = data.added;

      // 「＋新しく追加する」の直前に追加
      const newOption = Array.from(select.options).find(opt => opt.value === "_new_");
      if (newOption) {
        select.insertBefore(option, newOption);
      } else {
        select.appendChild(option);
      }

      select.value = data.added;
    } else {
      alert("追加に失敗しました。");
    }
  })
  .catch(err => {
    console.error("Fetch エラー:", err);
    alert("サーバー通信エラーです。");
  });
}

// ===== 選択肢の削除処理 =====
function deleteSelectedOption(selectId, type) {
  const select = document.getElementById(selectId);
  const value = select.value;

  if (!value || value === "_new_") {
    alert("削除する項目を選択してください。");
    return;
  }

  if (!confirm(`「${value}」を削除しますか？`)) return;

  fetch('/delete_option/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({ type: type, value: value })
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === 'ok') {
      alert(`「${data.deleted}」を削除しました。`);
    } else {
      alert(data.message || "削除に失敗しました。");
    }
  })
  .catch(err => {
    console.error("Fetch エラー:", err);
    alert("サーバー通信エラーです。");
  });
}



// ===== イベント登録 =====
document.addEventListener('DOMContentLoaded', () => {
  const workerSelect = document.getElementById('task-worker');
  const cropSelect = document.getElementById('task-target-crop');

  workerSelect.addEventListener('change', function() {
    if (this.value === '_new_') {
      promptNewOption('task-worker', 'workers');
    }
  });

  cropSelect.addEventListener('change', function() {
    if (this.value === '_new_') {
      promptNewOption('task-target-crop', 'crops');
    }
  });
});


// ===== CSRF トークン取得 =====
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

  </script>
</body>
</html>
